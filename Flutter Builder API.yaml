openapi: 3.0.3
info:
  title: Flutter Builder API
  version: 1.0.0
  description: API for generating Flutter applications from JSON specifications.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Authenticate and receive the account token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Delete the current authentication token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      summary: Register an account and receive its authentication token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/components/:
    get:
      operationId: components_list
      summary: List user private custom components.
      tags:
      - components
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Component'
          description: ''
    post:
      operationId: components_create
      summary: Save a private reusable custom component.
      tags:
      - components
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Component'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Component'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
  /api/components/{id}/:
    get:
      operationId: components_retrieve
      summary: Get a single component template.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this component.
        required: true
      tags:
      - components
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
    put:
      operationId: components_update
      summary: Replace one of user custom component templates.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this component.
        required: true
      tags:
      - components
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Component'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Component'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
    patch:
      operationId: components_partial_update
      summary: Update one of user custom component templates.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this component.
        required: true
      tags:
      - components
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedComponent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedComponent'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
    delete:
      operationId: components_destroy
      summary: Delete one of user custom component templates.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this component.
        required: true
      tags:
      - components
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/components/available/:
    get:
      operationId: components_available_retrieve
      description: Return every building block the Flutter generator can emit.
      summary: List every Flutter building block supported by the generator.
      tags:
      - components
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
  /api/components/categories/:
    get:
      operationId: components_categories_retrieve
      summary: List categories for supported building blocks.
      tags:
      - components
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
  /api/generate/quick_generate/:
    post:
      operationId: generate_quick_generate_create
      description: Provide validated JSON or an existing project_id that you own.
      summary: Generate and download a Flutter ZIP without saving a project.
      tags:
      - generate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateFlutter'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenerateFlutter'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: A zip file containing the generated Flutter project
          description: ''
  /api/projects/:
    get:
      operationId: projects_list
      summary: List user projects.
      tags:
      - projects
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: projects_create
      summary: Create a project from validated builder JSON.
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreate'
          description: ''
  /api/projects/{id}/:
    get:
      operationId: projects_retrieve
      summary: Get one of user projects.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    put:
      operationId: projects_update
      summary: Replace a project and its builder JSON.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: projects_partial_update
      summary: Update selected project fields.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProject'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    delete:
      operationId: projects_destroy
      summary: Delete a project and its generated files.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/projects/{id}/build_apk/:
    post:
      operationId: projects_build_apk_create
      summary: Queue a release APK build from the generated ZIP.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
          description: ''
  /api/projects/{id}/download/:
    get:
      operationId: projects_download_retrieve
      summary: Download the latest generated Flutter ZIP.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/download_apk/:
    get:
      operationId: projects_download_apk_retrieve
      description: Download the built APK file.
      summary: Download the latest built release APK.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/generate/:
    post:
      operationId: projects_generate_create
      summary: Queue Flutter ZIP generation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
          description: ''
  /api/projects/{id}/jobs/:
    get:
      operationId: project_jobs_list
      summary: List this project’s background jobs.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenerationJob'
          description: ''
  /api/projects/{id}/jobs/{job_id}/:
    get:
      operationId: project_job_status_retrieve
      summary: Get one background job’s current status.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
          description: ''
  /api/projects/{id}/logs/:
    get:
      operationId: projects_logs_retrieve
      summary: List generation and preview logs for this project.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/preview_heartbeat/:
    post:
      operationId: projects_preview_heartbeat_create
      summary: Keep an active preview from being reaped for idleness.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/preview_status/:
    get:
      operationId: projects_preview_status_retrieve
      description: Return the current launch state for one live preview.
      summary: Get the current live-preview readiness state.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/start_preview/:
    post:
      operationId: projects_start_preview_create
      description: Queue a live preview server start and return its pollable job.
      summary: Queue startup of a live Flutter web preview.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
          description: ''
  /api/projects/{id}/stop_preview/:
    post:
      operationId: projects_stop_preview_create
      description: Stop the preview server for a project.
      summary: Stop this project’s live preview process.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/update_preview/:
    post:
      operationId: projects_update_preview_create
      summary: Regenerate one preview screen and hot restart.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/active_previews/:
    get:
      operationId: projects_active_previews_retrieve
      description: Get list of all active preview servers.
      summary: List active preview processes visible to this server.
      tags:
      - projects
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/screens/:
    get:
      operationId: screens_list
      summary: List legacy screen records for user projects.
      tags:
      - screens
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Screen'
          description: ''
    post:
      operationId: screens_create
      summary: Create a legacy screen record; project JSON remains authoritative.
      tags:
      - screens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Screen'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Screen'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Screen'
          description: ''
  /api/screens/{id}/:
    get:
      operationId: screens_retrieve
      summary: Get one legacy screen record.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this screen.
        required: true
      tags:
      - screens
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Screen'
          description: ''
    put:
      operationId: screens_update
      summary: Replace a legacy screen record.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this screen.
        required: true
      tags:
      - screens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Screen'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Screen'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Screen'
          description: ''
    patch:
      operationId: screens_partial_update
      summary: Update selected legacy screen fields.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this screen.
        required: true
      tags:
      - screens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedScreen'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedScreen'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Screen'
          description: ''
    delete:
      operationId: screens_destroy
      summary: Delete a legacy screen record.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this screen.
        required: true
      tags:
      - screens
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Component:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        description:
          type: string
        thumbnail:
          type: string
          format: uri
          nullable: true
        template_json: {}
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - name
      - template_json
      - type
    GenerateFlutter:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        json_data: {}
        app_name:
          type: string
          maxLength: 100
        package_name:
          type: string
          maxLength: 255
    GenerationJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job_type:
          allOf:
          - $ref: '#/components/schemas/JobTypeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/GenerationJobStatusEnum'
          readOnly: true
        error_message:
          type: string
          readOnly: true
        result:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - completed_at
      - created_at
      - error_message
      - id
      - job_type
      - result
      - started_at
      - status
    GenerationJobStatusEnum:
      enum:
      - queued
      - running
      - completed
      - failed
      type: string
      description: |-
        * `queued` - Queued
        * `running` - Running
        * `completed` - Completed
        * `failed` - Failed
    JobTypeEnum:
      enum:
      - generate
      - build_apk
      - start_preview
      type: string
      description: |-
        * `generate` - Generate Flutter project
        * `build_apk` - Build APK
        * `start_preview` - Start preview
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    PatchedComponent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        description:
          type: string
        thumbnail:
          type: string
