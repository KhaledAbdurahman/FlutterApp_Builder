<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flutter Builder - Visual App Development</title>
    <meta
      name="description"
      content="Build Flutter mobile apps visually with drag-and-drop. Design screens, add widgets, and export ready-to-use Flutter code."
    />
    <meta name="author" content="Flutter Builder" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080c16" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        const savedScheme = localStorage.getItem('mantine-color-scheme-value') || 'dark';
        const colorScheme =
          savedScheme === 'auto'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : savedScheme;

        document.documentElement.dataset.mantineColorScheme = colorScheme;
        document.documentElement.classList.toggle('dark', colorScheme === 'dark');
      })();
    </script>

    <meta property="og:title" content="Flutter Builder - Visual App Development" />
    <meta
      property="og:description"
      content="Build Flutter mobile apps visually with drag-and-drop components."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image-light-1200x630.jpg" />
    <meta property="og:image" content="/og-image-dark-1200x630.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AppBuilder visual Flutter development preview" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FlutterBuilder" />
    <meta name="twitter:image" content="/og-image-light-1200x630.jpg" />
    <meta name="twitter:image:alt" content="AppBuilder visual Flutter development preview" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
